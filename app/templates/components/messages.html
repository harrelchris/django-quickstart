{% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-4" style="z-index: 1060;">
    {% for message in messages %}
      <div class="toast toast-message border-0 border-start border-4 border-{% if 'error' in message.tags %}danger{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %} shadow-sm" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex justify-content-between align-items-center p-2">
          <div class="toast-body fw-medium text-dark">
            {{ message }}
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toastElList = document.querySelectorAll(".toast-message");
      const toastList = [...toastElList].map(toastEl => new bootstrap.Toast(toastEl, { delay: 5000 }));
      toastList.forEach(toast => toast.show());
    });
  </script>
{% endif %}
