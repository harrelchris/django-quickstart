{% extends "users/base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
  <div class="container my-5">
    <h1 class="mb-4">Dashboard</h1>
    <div class="row">
      <!-- Manage Account Card -->
      <div class="col-md-6 col-lg-4 mb-3">
        <div class="card h-100 shadow-sm border-0 bg-light">
          <div class="card-body">
            <h5 class="card-title">Manage Account</h5>
            <a href="{% url 'account_email' %}" class="btn btn-outline-primary btn-sm mt-2">Update Email</a>
            <a href="{% url 'account_change_password' %}" class="btn btn-outline-primary btn-sm mt-2">Change Password</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
